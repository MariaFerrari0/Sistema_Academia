{% extends 'gym/base.html' %}

{% block title %}
Cadastrar Aluno | PowerOn
{% endblock %}

{% block page_title %}
Cadastrar Aluno
{% endblock %}

{% block content %}

<div class="form-container">

    <div class="page-header">
        <div>
            <h2>Novo aluno</h2>
            <p>Cadastre as informações do aluno.</p>
        </div>
    </div>

    <form>

        <div class="form-grid">

            <div class="form-group">
                <label for="codigo">Código</label>
                <input type="number" id="codigo" name="codigo">
            </div>

            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome">
            </div>

            <div class="form-group">
                <label for="data_nascimento">Data de nascimento</label>
                <input
                    type="date"
                    id="data_nascimento"
                    name="data_nascimento"
                >
            </div>

            <div class="form-group">
                <label for="peso">Peso</label>
                <input
                    type="number"
                    id="peso"
                    name="peso"
                    step="0.01"
                    min="0"
                >
            </div>

            <div class="form-group">
                <label for="altura">Altura</label>
                <input
                    type="number"
                    id="altura"
                    name="altura"
                    step="0.01"
                    min="0"
                >
            </div>

        </div>

        <div class="form-actions">
            <a href="{% url 'lista_alunos' %}" class="btn-secondary">
                Cancelar
            </a>

            <button type="submit" class="btn-primary">
                Cadastrar aluno
            </button>
        </div>

    </form>

</div>

{% endblock %}
