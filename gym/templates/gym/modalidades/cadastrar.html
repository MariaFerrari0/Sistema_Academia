{% extends 'gym/base.html' %}

{% block title %}
Cadastrar Modalidade | PowerOn
{% endblock %}

{% block page_title %}
Cadastrar Modalidade
{% endblock %}

{% block content %}

<div class="form-container">

    <div class="page-header">
        <div>
            <h2>Nova modalidade</h2>
            <p>Cadastre uma nova modalidade da academia.</p>
        </div>
    </div>

    <form>

        <div class="form-grid">

            <div class="form-group">
                <label for="codigo_modalidade">
                    Código da modalidade
                </label>

                <input
                    type="number"
                    id="codigo_modalidade"
                    name="codigo_modalidade"
                >
            </div>

            <div class="form-group">
                <label for="descricao">
                    Descrição
                </label>

                <input
                    type="text"
                    id="descricao"
                    name="descricao"
                >
            </div>

            <div class="form-group">
                <label for="cod_prof">
                    Código do professor
                </label>

                <input
                    type="number"
                    id="cod_prof"
                    name="cod_prof"
                >
            </div>

            <div class="form-group">
                <label for="valor_aula">
                    Valor da aula
                </label>

                <input
                    type="number"
                    id="valor_aula"
                    name="valor_aula"
                    step="0.01"
                    min="0"
                >
            </div>

            <div class="form-group">
                <label for="limite_alunos">
                    Limite de alunos
                </label>

                <input
                    type="number"
                    id="limite_alunos"
                    name="limite_alunos"
                    min="1"
                >
            </div>

        </div>

        <div class="form-actions">

            <a href="{% url 'lista_modalidades' %}" class="btn-secondary">
                Cancelar
            </a>

            <button type="submit" class="btn-primary">
                Cadastrar modalidade
            </button>

        </div>

    </form>

</div>

{% endblock %}
