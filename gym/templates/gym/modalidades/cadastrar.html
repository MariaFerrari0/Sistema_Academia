{% extends 'gym/base.html' %}

{% block title %}Nova modalidade | PowerOn{% endblock %}

{% block page_title %}Cadastrar modalidade{% endblock %}

{% block content %}

<div class="form-card">

    <div class="form-header">
        <h3>Dados da modalidade</h3>
        <p>Cadastre uma nova atividade.</p>
    </div>

    <form>

        <div class="form-grid">

            <div class="form-group">
                <label>Nome da modalidade</label>
                <input type="text" placeholder="Ex.: Musculação">
            </div>

            <div class="form-group">
                <label>Professor</label>

                <select>
                    <option>Selecione um professor</option>
                </select>

            </div>

            <div class="form-group">
                <label>Quantidade de vagas</label>
                <input type="number" placeholder="Ex.: 20">
            </div>

            <div class="form-group">
                <label>Horário</label>
                <input type="time">
            </div>

        </div>

        <div class="form-actions">

            <a href="{% url 'lista_modalidades' %}" class="btn-secondary">
                Cancelar
            </a>

            <button class="btn-primary">
                Cadastrar modalidade
            </button>

        </div>

    </form>

</div>

{% endblock %}
