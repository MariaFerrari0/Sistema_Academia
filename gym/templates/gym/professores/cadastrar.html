{% extends 'gym/base.html' %}

{% block title %}
Cadastrar Professor | PowerOn
{% endblock %}

{% block page_title %}
Cadastrar Professor
{% endblock %}

{% block content %}

<div class="form-container">

    <div class="page-header">
        <div>
            <h2>Novo professor</h2>
            <p>Cadastre as informações do professor.</p>
        </div>
    </div>

    <form>

        <div class="form-grid">

            <div class="form-group">
                <label for="codigo_prof">Código do professor</label>
                <input
                    type="number"
                    id="codigo_prof"
                    name="codigo_prof"
                >
            </div>

            <div class="form-group">
                <label for="nome">Nome</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                >
            </div>

            <div class="form-group">
                <label for="endereco">Endereço</label>
                <input
                    type="text"
                    id="endereco"
                    name="endereco"
                >
            </div>

            <div class="form-group">
                <label for="telefone">Telefone</label>
                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                >
            </div>

        </div>

        <div class="form-actions">

            <a href="{% url 'lista_professores' %}" class="btn-secondary">
                Cancelar
            </a>

            <button type="submit" class="btn-primary">
                Cadastrar professor
            </button>

        </div>

    </form>

</div>

{% endblock %}
