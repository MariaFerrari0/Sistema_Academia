{% extends 'gym/base.html' %}

{% block title %}Novo professor | PowerOn{% endblock %}

{% block page_title %}Cadastrar professor{% endblock %}

{% block content %}

<div class="form-card">

    <div class="form-header">
        <h3>Dados do professor</h3>
        <p>Cadastre um novo profissional.</p>
    </div>

    <form>

        <div class="form-grid">

            <div class="form-group">
                <label>Nome completo</label>
                <input type="text" placeholder="Digite o nome">
            </div>

            <div class="form-group">
                <label>Registro profissional</label>
                <input type="text" placeholder="CREF">
            </div>

            <div class="form-group">
                <label>Especialidade</label>
                <input type="text" placeholder="Ex.: Musculação">
            </div>

            <div class="form-group">
                <label>Telefone</label>
                <input type="text" placeholder="(00) 00000-0000">
            </div>

        </div>

        <div class="form-actions">

            <a href="{% url 'lista_professores' %}" class="btn-secondary">
                Cancelar
            </a>

            <button class="btn-primary">
                Cadastrar professor
            </button>

        </div>

    </form>

</div>

{% endblock %}
