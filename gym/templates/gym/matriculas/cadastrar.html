{% extends 'gym/base.html' %}

{% block title %}Nova matrícula | PowerOn{% endblock %}

{% block page_title %}Nova matrícula{% endblock %}

{% block content %}

<div class="form-card">

    <div class="form-header">
        <h3>Dados da matrícula</h3>
        <p>Vincule um aluno a uma modalidade.</p>
    </div>

    <form>

        <div class="form-grid">

            <div class="form-group">
                <label>Aluno</label>

                <select>
                    <option>Selecione um aluno</option>
                </select>

            </div>

            <div class="form-group">
                <label>Modalidade</label>

                <select>
                    <option>Selecione uma modalidade</option>
                </select>

            </div>

            <div class="form-group">
                <label>Data da matrícula</label>
                <input type="date">
            </div>

            <div class="form-group">
                <label>Status</label>

                <select>
                    <option>Ativa</option>
                    <option>Inativa</option>
                </select>

            </div>

        </div>

        <div class="form-actions">

            <a href="{% url 'lista_matriculas' %}" class="btn-secondary">
                Cancelar
            </a>

            <button class="btn-primary">
                Cadastrar matrícula
            </button>

        </div>

    </form>

</div>

{% endblock %}
